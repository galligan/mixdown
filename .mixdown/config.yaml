# .mixdown/config.yaml
# -------------------------------------------------------------------
# Global settings for the Mixdown compiler / CLI.
# Most keys are optional; uncomment / tweak as your repo evolves.
# -------------------------------------------------------------------

# ---------- project configuration ------------------------------------
project:
  name: mixdown
  default-tools: ["cursor", "windsurf", "claude-code"] # fallback if a mix omits include/exclude
  default-output-type: rule                            # "rule" | "command" | "prompt"

# ---------- aliases --------------------------------------------------
aliases:                        # expands the value when $[alias] is used
  legal: "[include:project.legal]" # injects the value for the `legal` key in the `project` profile
  privacy: "[include:project.privacy]"

# ---------- Mixdown configuration ------------------------------------
mixdown:

  # ---------- directory layout ---------------------------------------
  source-dir: prompts           # root directory that contains instructions, includes, templates, etc.
  public-dir: artifacts         # where artifacts are stored (relative to source-dir)
  builds-dir: builds            # where build artifacts are stored (relative to public-dir)
  # The CLI will resolve:
  #   build-store = path.join(source-dir, public-dir, builds-dir)
  #   latest-link = path.join(source-dir, public-dir, "latest")

  # ---------- build lifecycle ----------------------------------------
  keep-builds: 7                # garbage‑collect older builds; 0 = keep all
  build-pattern: "yyyyMMdd-HHmmss'Z'" # build‑id naming (use 'build-{hash}' if preferred)
  symlink-mode: latest          # none | latest | all

  # ---------- reports ------------------------------------------------
  reports:
    keep-reports: true          # still write runs/<id>/report.json even in --dry-run
    dir: .mixdown/reports       # where reports are stored (relative to project root)

  # ---------- outputs ------------------------------------------------
  naming:
    label-affix:
      scope: all                  # default: all | first | last | 2, 3, etc.
      placement: prefix           # prefix | suffix
      separator: "-"              # single char: "-" | "_" | "."
      # default behavior:
      #   labels: [docs, api]  ->  docs-api-auth.mdc

    path-affix:                   # prepend/append sub‑folder names to filename
      depth: 0                    # 0 = off (default), 1 = last dir, 2 = last‑2 dirs …
      placement: prefix           # prefix | suffix
      separator: "-"              # single char: "-" | "_" | "."
      # note: not applied to path-located files e.g. CLAUDE.md
      # examples (mix at prompts/instructions/docs/api/auth.mixd):
      #   depth: 0, off     -> auth.mdc
      #   depth: 1, prefix  -> api-auth.mdc
      #   depth: 2, suffix  -> auth-docs-api.mdc
      #   depth: 3, prefix  -> docs-api-auth.mdc (instructions path is excluded)

# ---------- development ----------------------------------------------
dev:
  validator:
    strict: false                 # true = fail build on any warning
    ignore-unknown-tags: true     # true = allow custom XML tags without schema update
    lint-placeholders: true       # warn on missing or malformed [...]/$[...] placeholders
  cache:
    enabled: true
    dir: .mixdown/cache           # per‑user cache; CI can override
    checksum-algo: sha256         # influences diff / skip‑build logic
  ci:
    fail-on-output-diff: true     # exits non‑zero if regenerated artifacts differ from main
    diff-base: origin/main        # branch / commit to compare against
  telemetry:
    enabled: false                # CI can override with MIXDOWN_TELEMETRY=1

# ---------- includes -------------------------------------------------
includes:
  runtime:                      # $[include:@...] built‑ins
    enabled: true
    allow-shell-exec: false     # safeguard; set true if you trust commands like $[git-branch]
    builtins:
      git-branch: 'git rev-parse --abbrev-ref HEAD'
      package-version: "node -p \"require('./package.json').version\""
      random-uuid: uuidgen

# ---------- plugins --------------------------------------------------
plugins:
  search-paths:                 # interpreted relative to this file; use absolute if you need workspace root.
    - ../node_modules
    - ../packages             # monorepo workspace

  # ---------- Cursor -------------------------------------------------
  "@mixdown/plugin-cursor":
    enabled: true
    dir: .cursor         # project‑relative base for this tool
    types:
      rule:                      # -> .cursor/rules/{rule-name}.mdc
        # output:                # change to override the default output
        #   dir: rules
        #   extension: mdc
        # path-affix:          
        #   depth: 0            # Turn on path affixing for Cursor-only

  # ---------- Roo Code -----------------------------------------------
  "@mixdown/plugin-roo-code":
    enabled: true
    dir: .roo
    types:
      mode-rule:                 # .roo/rules-{mode}/{rule-name}.md
        output:
          dir: rules
          extension: md

  # ---------- Claude Code --------------------------------------------
  "@mixdown/plugin-claude-code":
    enabled: true
    dir: .                 # writes into repo root by default
    types:
      rule:                      # -> ./CLAUDE.md
        # single‑file tool; default file is CLAUDE.md in repo root
      command:
        output:
          dir: .claude/commands
          extension: md          # -> .claude/commands/{command-name}.md

  # ---------- OpenAI Codex CLI ---------------------------------------
  "@mixdown/plugin-codex-cli":
    enabled: true
    dir: .
    # default single‑file codex.md; override with 'types.rule.output.file:' only if needed