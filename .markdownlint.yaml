# .markdownlint.yaml
default: true

# Line length rule configuration
MD013:
  line_length: 100
  code_blocks: false
  tables: false

# Allow HTML for details/summary elements
MD033: false

# Allow front-matter before first heading
MD041: false

# Enforce TOC presence
MD043:
  required_headings:
    - "^# .*"
    - "^## Table of Contents$"

# Custom rules
extends: 
  - "./.mixdown/markdown-lint-rules.js" 